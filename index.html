<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-secondary d-flex justify-content-center align-items-center vh-100">

    <div class="card bg-black text-white p-4 shadow-lg rounded-4"
         style="width: 550px; max-width: 95%;">

        <div class="text-center mb-4">
            <span class="bg-dark text-info px-4 py-2 fs-3 fw-bold rounded border border-primary">
                Translator App
            </span>
        </div>

        <div class="row g-3 mb-3">

            <div class="col-6">
                <textarea
                    id="text"
                    class="form-control bg-secondary text-white border-light"
                    rows="7"
                ></textarea>
            </div>

            <div class="col-6">
                <textarea
                    id="translatedText"
                    class="form-control bg-dark text-white border-light"
                    rows="7"
                    placeholder="Translation..."
                    readonly
                ></textarea>
            </div>

        </div>

        <div class="row g-3 mb-4">

            <div class="col-6">
                <select
                    id="from"
                    class="form-select bg-dark text-white border-secondary"
                ></select>
            </div>

            <div class="col-6">
                <select
                    id="to"
                    class="form-select bg-dark text-white border-secondary"
                ></select>
            </div>

        </div>

        <div class="text-center">
            <button
                id="translate"
                class="btn btn-dark text-primary border border-primary px-5 py-2 fw-semibold"
            >
                Translate
            </button>
        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
